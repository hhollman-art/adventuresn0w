<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f0e6cf" />
  <title>D&amp;D Easy — Launcher</title>
  <style>
    :root {
      --bg: #f0e6cf;
      --surface: #faf4e4;
      --border: #d6c49c;
      --text: #2f2616;
      --muted: #75653f;
      --accent: #9a7416;
      --accent-dim: #c9a227;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 0%, rgba(255, 250, 235, 0.85), transparent 70%),
        radial-gradient(ellipse 120% 90% at 50% 110%, rgba(150, 113, 50, 0.16), transparent 65%);
      color: var(--text);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 30rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.25rem 2.5rem 2rem;
      box-shadow:
        0 0 0 1px rgba(255, 252, 245, 0.75) inset,
        0 0 0 4px rgba(154, 116, 22, 0.07) inset,
        0 2px 10px rgba(95, 70, 25, 0.15);
      text-align: center;
    }

    .die {
      font-size: 2.5rem;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.6rem;
      letter-spacing: 0.01em;
    }

    h1 .accent { color: var(--accent); }

    .tagline {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.online { background: #4ade80; box-shadow: 0 0 6px rgba(74, 222, 128, 0.6); }
    .dot.offline { background: #f87171; }
    .dot.checking { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    a.launch {
      display: inline-block;
      padding: 0.7rem 2.2rem;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    a.launch:hover { background: #b1891f; }

    a.launch.disabled {
      background: var(--accent-dim);
      pointer-events: none;
      opacity: 0.7;
    }

    .hint {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .hint code {
      background: rgba(154, 116, 22, 0.08);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.1rem 0.4rem;
      font-size: 0.78rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="die" aria-hidden="true">&#127922;</div>
    <h1>D<span class="accent">&amp;</span>D Easy</h1>
    <p class="tagline">
      Generate D&amp;D 5.2-style adventures, pre-made characters, realms, and battle-map images.
    </p>

    <div class="status">
      <span id="status-dot" class="dot checking"></span>
      <span id="status-text">Checking if the app is running&hellip;</span>
    </div>

    <a id="launch" class="launch disabled" href="http://localhost:3000">Open D&amp;D Easy</a>

    <p class="hint">
      App not running? Start it from the project folder with
      <code>npm run dev</code>, then refresh this page.
    </p>
  </main>

  <script>
    // Set this to the deployed app URL (e.g. "https://ddeasy.vercel.app")
    // once the app is hosted. Visitors on GitHub Pages are then sent there.
    const PUBLIC_APP_URL = "";
    const LOCAL_APP_URL = "http://localhost:3000";

    const dot = document.getElementById("status-dot");
    const text = document.getElementById("status-text");
    const launch = document.getElementById("launch");
    const hint = document.querySelector(".hint");

    const onGitHubPages = location.hostname.endsWith("github.io");

    if (PUBLIC_APP_URL) {
      launch.href = PUBLIC_APP_URL;
      launch.classList.remove("disabled");
      dot.className = "dot online";
      text.textContent = "Taking you to the app\u2026";
      location.replace(PUBLIC_APP_URL);
    } else if (onGitHubPages) {
      // No public deployment configured: GitHub Pages cannot run the
      // Next.js server, so explain instead of probing the visitor's localhost.
      dot.className = "dot offline";
      text.textContent = "No public deployment configured yet";
      hint.innerHTML =
        "This page is served by GitHub Pages, which only hosts static files. " +
        "The D&amp;D Easy app needs a Node server for its AI generation, so it must be " +
        "deployed to a host like Vercel. Run it locally with <code>npm run dev</code>.";
    } else {
      checkServer();
    }

    async function checkServer() {
      try {
        // no-cors: a resolved fetch means something answered on the port.
        await fetch(LOCAL_APP_URL, { mode: "no-cors", cache: "no-store" });
        dot.className = "dot online";
        text.textContent = "App is running on localhost:3000";
        launch.classList.remove("disabled");
      } catch {
        dot.className = "dot offline";
        text.textContent = "App is not running";
        launch.classList.add("disabled");
        setTimeout(checkServer, 3000);
      }
    }
  </script>
</body>
</html>
