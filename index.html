<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1419" />
  <title>D&amp;D Easy — Launcher</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --border: #2d3a47;
      --text: #e8eef4;
      --muted: #8a9ba8;
      --accent: #c9a227;
      --accent-dim: #8f7320;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201, 162, 39, 0.08), transparent);
      color: var(--text);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 30rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.25rem 2.5rem 2rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .die {
      font-size: 2.5rem;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.6rem;
      letter-spacing: 0.01em;
    }

    h1 .accent { color: var(--accent); }

    .tagline {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.online { background: #4ade80; box-shadow: 0 0 6px rgba(74, 222, 128, 0.6); }
    .dot.offline { background: #f87171; }
    .dot.checking { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    a.launch {
      display: inline-block;
      padding: 0.7rem 2.2rem;
      border-radius: 10px;
      background: var(--accent);
      color: #0f1419;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    a.launch:hover { background: #dab43a; }

    a.launch.disabled {
      background: var(--accent-dim);
      pointer-events: none;
      opacity: 0.7;
    }

    .hint {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .hint code {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.1rem 0.4rem;
      font-size: 0.78rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="die" aria-hidden="true">&#127922;</div>
    <h1>D<span class="accent">&amp;</span>D Easy</h1>
    <p class="tagline">
      Generate D&amp;D 5.2-style adventures, pre-made characters, realms, and battle-map images.
    </p>

    <div class="status">
      <span id="status-dot" class="dot checking"></span>
      <span id="status-text">Checking if the app is running&hellip;</span>
    </div>

    <a id="launch" class="launch disabled" href="http://localhost:3000">Open D&amp;D Easy</a>

    <p class="hint">
      App not running? Start it from the project folder with
      <code>npm run dev</code>, then refresh this page.
    </p>
  </main>

  <script>
    const APP_URL = "http://localhost:3000";
    const dot = document.getElementById("status-dot");
    const text = document.getElementById("status-text");
    const launch = document.getElementById("launch");

    async function checkServer() {
      try {
        // no-cors: a resolved fetch means something answered on the port.
        await fetch(APP_URL, { mode: "no-cors", cache: "no-store" });
        dot.className = "dot online";
        text.textContent = "App is running on localhost:3000";
        launch.classList.remove("disabled");
      } catch {
        dot.className = "dot offline";
        text.textContent = "App is not running";
        launch.classList.add("disabled");
        setTimeout(checkServer, 3000);
      }
    }

    checkServer();
  </script>
</body>
</html>
